name: Upstream emulator compatibility audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upstream-compatibility.yml'
jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Obtain actual emulator source
        run: |
          git clone --depth 1 https://github.com/daberkow/cybiko-java-emulator.git upstream
          git -C upstream rev-parse HEAD | tee UPSTREAM_COMMIT.txt
          cp upstream/LICENSE UPSTREAM_LICENSE.txt
          grep -qi 'MIT License' UPSTREAM_LICENSE.txt
      - name: Build upstream emulator (no proprietary ROMs)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :emulator:classes --no-daemon
      - name: Test upstream emulator (no proprietary ROMs)
        working-directory: upstream
        run: ./gradlew :emulator:test --no-daemon
      - name: Generate Android porting report
        run: |
          python3 tools/audit_android_port.py upstream/emulator/src > ANDROID_PORT_REPORT.md
          find upstream/emulator/src -type f -name '*.java' | sort > JAVA_SOURCES.txt
          mkdir -p upstream-export
          cp -a upstream/emulator upstream-export/
          cp UPSTREAM_LICENSE.txt UPSTREAM_COMMIT.txt ANDROID_PORT_REPORT.md JAVA_SOURCES.txt upstream-export/
          tar -czf upstream-porting-kit.tar.gz -C upstream-export .
      - uses: actions/upload-artifact@v4
        with:
          name: cybiko-upstream-porting-kit
          path: |
            upstream-porting-kit.tar.gz
            ANDROID_PORT_REPORT.md
            UPSTREAM_COMMIT.txt
            UPSTREAM_LICENSE.txt
          retention-days: 30
