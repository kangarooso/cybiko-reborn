name: Build real Cybiko emulator and Android prototype
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-real-emulator.yml'
jobs:
  upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve original emulator source
        run: |
          git clone --depth 1 https://github.com/daberkow/cybiko-java-emulator.git upstream
          git -C upstream rev-parse HEAD > UPSTREAM_COMMIT.txt
          cp upstream/LICENSE UPSTREAM_LICENSE.txt
          grep -qi 'MIT License' UPSTREAM_LICENSE.txt
      - name: Compile and test upstream emulator
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :emulator:build --no-daemon
      - name: Smoke test actual upstream executable JAR (no ROM needed)
        run: |
          python3 - <<'PYCODE'
          import pathlib, subprocess, sys
          jars = list(pathlib.Path('upstream/emulator/build/libs').glob('*.jar'))
          if not jars:
              raise SystemExit('No emulator JARs produced')
          errors = []
          for jar in jars:
              proc = subprocess.run([sys.executable, 'tools/smoke_upstream_jar.py', str(jar)], capture_output=True, text=True)
              if proc.returncode == 0:
                  print(proc.stdout)
                  break
              errors.append(f'{jar.name}: {proc.stderr.strip()}')
          else:
              raise SystemExit('No runnable upstream JAR passed the smoke test\n' + '\n'.join(errors))
          PYCODE
      - name: Audit Android portability from actual upstream files
        run: |
          python3 tools/analyze_upstream_java.py upstream/emulator/src --output upstream-port-inventory.json
      - name: Test upstream source inventory tool
        run: python3 -m unittest discover -s tests -p 'test_upstream_inventory.py' -v
      - name: Package real emulator binaries and sources
        run: |
          mkdir -p dist/emulator-jars dist/upstream-source
          find upstream/emulator/build/libs -maxdepth 1 -name '*.jar' -type f -exec cp {} dist/emulator-jars/ \;
          test "$(find dist/emulator-jars -name '*.jar' | wc -l)" -gt 0
          cp -a upstream/emulator/src dist/upstream-source/
          cp UPSTREAM_COMMIT.txt UPSTREAM_LICENSE.txt upstream-port-inventory.json dist/
          cat > dist/README.txt <<'TEXT'
          These JAR files contain the original Java emulator, NOT an Android emulator.
          Java 21 is required. The original Classic V1 firmware files are NOT included.
          Classic V1 requires cyrom112.bin and flash_v1246.bin.
          For a runnable distribution use the upstream fat JAR from emulator/build/libs.
          Example: java -jar Cybiko-Emulator-*.jar --machine v1 cyrom112.bin flash_v1246.bin --nvram localmemory.bin
          Original project: https://github.com/daberkow/cybiko-java-emulator
          Source revision and MIT license are included alongside the artifacts.
          TEXT
      - uses: actions/upload-artifact@v4
        with:
          name: real-cybiko-java-emulator-and-source
          path: dist/
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android prototype APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cybiko-reborn-prototype-apk-not-emulator
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
