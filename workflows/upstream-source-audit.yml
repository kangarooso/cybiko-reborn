name: Retrieve and validate upstream emulator
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upstream-source-audit.yml'
jobs:
  upstream-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream at recorded revision
        run: |
          git clone --depth 1 https://github.com/daberkow/cybiko-java-emulator.git upstream
          git -C upstream rev-parse HEAD | tee upstream-revision.txt
      - name: Validate license and source tree
        run: |
          test -f upstream/LICENSE
          grep -qi 'MIT License' upstream/LICENSE
          test -d upstream/emulator/src
          find upstream/emulator -type f -name '*.java' | sort > upstream-java-files.txt
          test -s upstream-java-files.txt
          cp upstream/LICENSE upstream-license.txt
          sha256sum upstream/LICENSE > upstream-license-sha256.txt
          echo "Java sources: $(wc -l < upstream-java-files.txt)"
      - name: Prepare portable upstream source archive
        run: |
          mkdir -p export/upstream
          cp -a upstream/emulator export/upstream/
          cp upstream/LICENSE upstream/README.md upstream/build.gradle upstream/settings.gradle export/upstream/
          cp upstream-revision.txt upstream-java-files.txt upstream-license-sha256.txt export/
          tar -czf upstream-emulator-source.tar.gz -C export .
          tar -tzf upstream-emulator-source.tar.gz > archive-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-emulator-source-and-license
          path: |
            upstream-emulator-source.tar.gz
            archive-manifest.txt
            upstream-revision.txt
            upstream-java-files.txt
            upstream-license.txt
            upstream-license-sha256.txt
          retention-days: 30
