name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project (with upstream emulator submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK in $ANDROID_HOME.
      # (android-actions/setup-android@v3 failed here because it tries to install the removed 'tools' package.)
      - name: Install Android platform 35 and build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Smoke tests (JVM, includes the upstream H8S core)
        run: bash tests/run-all-smoke.sh

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybiko-reborn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
